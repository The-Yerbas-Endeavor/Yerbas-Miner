name: Promote validated 1.0.0.6

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: yerbas-promote-1.0.0.6
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 30a1d5a06b9c344354106619afbab980d7573205
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30a1d5a06b9c344354106619afbab980d7573205
      - name: Verify successful build provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '1.0.0.6'
          for run in 38695872380 38695872372; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/run.json
            jq -e --arg sha "$RELEASE_SHA" '.head_sha == $sha and .conclusion == "success"' /tmp/run.json
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38833862612/jobs" > /tmp/jobs.json
          jq -e '[.jobs[] | select(.name == "Linux ARM64" and .conclusion == "success")] | length == 1' /tmp/jobs.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38695872380
          name: yerbas-miner-linux-cuda-x86_64
          path: incoming/linux
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38695872372
          name: yerbas-miner-windows-cuda-x86_64
          path: incoming/windows
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38833862612
          name: release-linux-arm64
          path: incoming/arm64
      - name: Package verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, tarfile, zipfile
          sha = os.environ['RELEASE_SHA']
          dist = Path('dist')
          dist.mkdir()
          linux = dist / 'yerbas-miner-linux-cuda-x86_64'
          linux.mkdir()
          with tarfile.open('incoming/linux/yerbas-miner-linux-cuda-x86_64.tar.gz') as archive:
              matches = [m for m in archive.getmembers() if m.isfile() and Path(m.name).name == 'yerbas-miner']
              assert len(matches) == 1
              with archive.extractfile(matches[0]) as src, (linux / 'yerbas-miner').open('wb') as dst:
                  shutil.copyfileobj(src, dst)
          (linux / 'yerbas-miner').chmod(0o755)
          for name in ['README.md', 'config.example.json', 'VERSION']:
              shutil.copyfile(name, linux / name)
          (linux / 'BUILD-INFO.txt').write_text(f'Yerbas Miner 1.0.0.6\nCommit: {sha}\nPlatform: Linux CUDA x86_64\nValidated CI run: 38695872380\n')
          with zipfile.ZipFile(dist / 'yerbas-miner-linux-cuda-x86_64.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in linux.iterdir(): archive.write(path, path.relative_to(dist))
          shutil.copyfile('incoming/windows/yerbas-miner-windows-cuda-x86_64.zip', dist / 'yerbas-miner-windows-cuda-x86_64.zip')
          with zipfile.ZipFile(dist / 'yerbas-miner-windows-cuda-x86_64.zip') as archive:
              assert any(Path(n).name == 'yerbas-miner.exe' for n in archive.namelist())
          arm = Path('incoming/arm64/yerbas-miner-linux-arm64.zip')
          with zipfile.ZipFile(arm) as archive:
              info = [n for n in archive.namelist() if Path(n).name == 'BUILD-INFO.txt']
              assert len(info) == 1
              text = archive.read(info[0]).decode()
              assert f'Commit: {sha}' in text and 'Yerbas Miner 1.0.0.6' in text
          shutil.copyfile(arm, dist / arm.name)
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish current stable release
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/1.0.0.6" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$RELEASE_SHA" ]; then
            echo 'Existing tag does not match validated source' >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/1.0.0.6 -f sha="$RELEASE_SHA"
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          Current stable release, pinned to validated source 30a1d5a06b9c344354106619afbab980d7573205.

          - Generic CPU/runtime dispatch and portable CUDA PTX/cubin targets.
          - Same full-detail garden artwork on Windows and Linux.
          - Opt-in blocking CUDA completion waits; experimental batch growth remains off.
          - Linux/Windows CUDA artifacts come from successful CI runs on this exact commit. ARM64 passed its build and correctness tests and its embedded source commit is verified.
          - Latest reviewed production snapshot: 9.01 sampled hours, 1815 H/s total, 5749 accepted shares and six stale rejects. Rotation-dependent raw throughput is not a guaranteed hash rate or pool-effective rate.
          - Development continues as 1.0.0.7; no additional mining-performance gain is claimed yet.

          See docs/development/RELEASE_1.0.0.6.md for build/run instructions and limitations. SHA256SUMS.txt covers all three binary archives.
          NOTES
          if gh release view 1.0.0.6 >/dev/null 2>&1; then
            gh release upload 1.0.0.6 dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit 1.0.0.6 --title 1.0.0.6 --notes-file /tmp/release-notes.md --latest
          else
            gh release create 1.0.0.6 dist/*.zip dist/SHA256SUMS.txt --title 1.0.0.6 --notes-file /tmp/release-notes.md --latest
          fi
