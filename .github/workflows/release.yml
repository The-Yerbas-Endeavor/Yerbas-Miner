name: Publish CUDA Release

on:
  push:
    tags:
      - '1.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must exactly match VERSION, e.g. 1.0.0.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: yerbas-miner-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Prepare requested version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            requested_version="$MANUAL_VERSION"
          else
            requested_version="$GITHUB_REF_NAME"
          fi

          [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]

          source_version="$(tr -d '\r\n' < VERSION)"
          release_sha="$RELEASE_SHA"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$source_version" != "$requested_version" ]; then
            printf '%s\n' "$requested_version" > VERSION
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "Set Yerbas Miner version $requested_version"
            git push origin "HEAD:$GITHUB_REF_NAME"
            release_sha="$(git rev-parse HEAD)"
          else
            test "$source_version" = "$requested_version"
          fi

          echo "version=$requested_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release version: $requested_version"
          echo "Release commit: $release_sha"

  linux-cuda:
    name: Linux CUDA x86_64
    needs: validate-version
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
    timeout-minutes: 300
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git libboost-dev
      - name: Install CUDA Toolkit 12.8.1
        id: cuda-toolkit
        timeout-minutes: 30
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'
      - name: Resolve CUDA compiler
        shell: bash
        run: |
          set -euxo pipefail
          if [ -n "${CUDA_PATH:-}" ] && [ -x "$CUDA_PATH/bin/nvcc" ]; then
            cuda_root="$CUDA_PATH"
          elif command -v nvcc >/dev/null 2>&1; then
            nvcc_path="$(readlink -f "$(command -v nvcc)")"
            cuda_root="$(dirname "$(dirname "$nvcc_path")")"
          elif [ -x /usr/local/cuda-12.8/bin/nvcc ]; then
            cuda_root=/usr/local/cuda-12.8
          else
            echo 'CUDA installer completed but nvcc was not found' >&2
            exit 1
          fi
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
          echo "CUDAToolkit_ROOT=$cuda_root" >> "$GITHUB_ENV"
          echo "$cuda_root/bin" >> "$GITHUB_PATH"
          "$cuda_root/bin/nvcc" --version
      - name: Use balanced NVCC parallelism
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          text = p.read_text()
          old = 'set(YERBAS_NVCC_PARALLEL_FLAGS --threads=0)'
          new = 'set(YERBAS_NVCC_PARALLEL_FLAGS --threads=2)'
          if old not in text:
              raise SystemExit('Could not locate YERBAS_NVCC_PARALLEL_FLAGS in CMakeLists.txt')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply Linux NVCC parity-buffer compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/cuda/generated/cuda_backend_gpu_faststart.inc')
          text = p.read_text()
          replacements = [
              ('    std::array<std::uint8_t, 2 * kStateBytes> a{};', '    std::uint8_t a[2 * kStateBytes]{};'),
              ('    std::array<std::uint8_t, 2 * kStateBytes> b{};', '    std::uint8_t b[2 * kStateBytes]{};'),
              ('cudaMemcpyAsync(a.data(), states, a.size(), cudaMemcpyDeviceToHost, stream)', 'cudaMemcpyAsync(a, states, sizeof(a), cudaMemcpyDeviceToHost, stream)'),
              ('cudaMemcpyAsync(b.data(), states, b.size(), cudaMemcpyDeviceToHost, stream)', 'cudaMemcpyAsync(b, states, sizeof(b), cudaMemcpyDeviceToHost, stream)'),
              ('    return a == b;', '    return std::memcmp(a, b, sizeof(a)) == 0;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected parity-buffer source not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Configure release
        shell: bash
        run: |
          set -euxo pipefail
          architectures='52-virtual;61-real;75-real;86-real;89-real;90-real'
          cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DYERBAS_ENABLE_CUDA=ON -DBUILD_TESTING=OFF "-DYERBAS_CUDA_ARCHITECTURES=$architectures" -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc" -DCUDAToolkit_ROOT="$CUDA_PATH"
      - name: Build release
        run: cmake --build build-cuda --target yerbas-miner --parallel 2
      - name: Package Linux release
        shell: bash
        run: |
          set -euxo pipefail
          out='dist/yerbas-miner-linux-cuda-x86_64'
          mkdir -p "$out"
          cp build-cuda/yerbas-miner "$out/yerbas-miner"
          cp README.md config.example.json VERSION "$out/"
          {
            echo "Yerbas Miner $RELEASE_VERSION"
            echo "Commit: $RELEASE_SHA"
            echo "Scheduler: remaining-time-v1"
            echo "Platform: Linux CUDA x86_64"
            echo "CUDA Toolkit: 12.8.1"
          } > "$out/BUILD-INFO.txt"
          cmake -E tar cf dist/yerbas-miner-linux-cuda-x86_64.zip --format=zip "$out"
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-cuda
          path: dist/yerbas-miner-linux-cuda-x86_64.zip
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: Linux ARM64
    needs: validate-version
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git libboost-dev

      - name: Configure ARM64 release
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-arm64 -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DYERBAS_ENABLE_CUDA=OFF             -DYERBAS_NATIVE_CPU=OFF             -DBUILD_TESTING=ON

      - name: Build and test ARM64
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-arm64 --target yerbas-miner --parallel
          ctest --test-dir build-arm64 --output-on-failure

      - name: Package ARM64 release
        shell: bash
        run: |
          set -euxo pipefail
          out='dist/yerbas-miner-linux-arm64'
          mkdir -p "$out"
          cp build-arm64/yerbas-miner "$out/yerbas-miner"
          cp README.md config.example.json VERSION "$out/"
          {
            echo "Yerbas Miner $RELEASE_VERSION"
            echo "Commit: $RELEASE_SHA"
            echo "Scheduler: remaining-time-v1"
            echo "Platform: Linux ARM64"
            echo "GPU backend: CPU-only build"
          } > "$out/BUILD-INFO.txt"
          cmake -E tar cf dist/yerbas-miner-linux-arm64.zip --format=zip "$out"

      - name: Upload ARM64 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: dist/yerbas-miner-linux-arm64.zip
          if-no-files-found: error
          retention-days: 30

  windows-cuda:
    name: Windows CUDA x86_64
    needs: validate-version
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
      RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
    timeout-minutes: 300
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}
      - name: Windows host compiler preflight
        shell: pwsh
        run: |
          cmake -S . -B build-preflight -G "Visual Studio 17 2022" -A x64 -DYERBAS_ENABLE_CUDA=OFF -DBUILD_TESTING=OFF
          cmake --build build-preflight --config Release --target yerbas-miner --parallel 2
      - name: Install CUDA Toolkit 12.8.1
        id: cuda-toolkit
        timeout-minutes: 20
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: local
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
      - name: Resolve CUDA compiler
        shell: pwsh
        run: |
          $candidates = @()
          if ($env:CUDA_PATH) { $candidates += (Join-Path $env:CUDA_PATH 'bin\nvcc.exe') }
          $candidates += 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\nvcc.exe'
          $candidates += 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8.1\bin\nvcc.exe'
          $nvcc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nvcc) { throw 'CUDA installer completed but nvcc.exe was not found' }
          $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cudaRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nvcc --version
      - name: Use balanced NVCC parallelism
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $old = 'set(YERBAS_NVCC_PARALLEL_FLAGS --threads=0)'
          $new = 'set(YERBAS_NVCC_PARALLEL_FLAGS --threads=2)'
          if (-not $cmake.Contains($old)) { throw 'Could not locate YERBAS_NVCC_PARALLEL_FLAGS in CMakeLists.txt' }
          $cmake.Replace($old, $new) | Set-Content CMakeLists.txt -NoNewline
      - name: Configure release
        shell: pwsh
        run: |
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          $architectures = '52-virtual;61-real;75-real;86-real;89-real;90-real'
          cmake -S . -B build-cuda -G "Visual Studio 17 2022" -A x64 -DYERBAS_ENABLE_CUDA=ON -DBUILD_TESTING=OFF "-DYERBAS_CUDA_ARCHITECTURES=$architectures" -DCMAKE_CUDA_COMPILER="$nvcc" -DCUDAToolkit_ROOT="$env:CUDA_PATH"
      - name: Build release
        shell: pwsh
        run: cmake --build build-cuda --config Release --target yerbas-miner --parallel 1
      - name: Package Windows release
        shell: pwsh
        run: |
          $exe = 'build-cuda/Release/yerbas-miner.exe'
          if (-not (Test-Path $exe)) { throw 'CUDA miner executable not produced' }
          $out = 'dist/yerbas-miner-windows-cuda-x86_64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe "$out/yerbas-miner.exe"
          Copy-Item README.md "$out/README.md"
          Copy-Item config.example.json "$out/config.example.json"
          Copy-Item VERSION "$out/VERSION"
          @("Yerbas Miner $env:RELEASE_VERSION","Commit: $env:RELEASE_SHA","Scheduler: remaining-time-v1","Platform: Windows CUDA x86_64","CUDA Toolkit: 12.8.1") | Set-Content "$out/BUILD-INFO.txt"
          Compress-Archive -Path "$out/*" -DestinationPath 'dist/yerbas-miner-windows-cuda-x86_64.zip'
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-cuda
          path: dist/yerbas-miner-windows-cuda-x86_64.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [validate-version, linux-cuda, windows-cuda, linux-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful release builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/yerbas-miner-linux-cuda-x86_64.zip
          test -f dist/yerbas-miner-windows-cuda-x86_64.zip
          test -f dist/yerbas-miner-linux-arm64.zip
          sha256sum dist/*.zip | tee dist/SHA256SUMS.txt
      - name: Create tag and publish release after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          tag="$RELEASE_VERSION"

          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$RELEASE_SHA" ]; then
            echo "ERROR: tag $tag already points to $existing_sha, not $RELEASE_SHA" >&2
            exit 1
          fi

          if [ -z "$existing_sha" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$tag"               -f sha="$RELEASE_SHA"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag"               dist/yerbas-miner-linux-cuda-x86_64.zip               dist/yerbas-miner-windows-cuda-x86_64.zip               dist/yerbas-miner-linux-arm64.zip               dist/SHA256SUMS.txt               --clobber
          else
            gh release create "$tag"               dist/yerbas-miner-linux-cuda-x86_64.zip               dist/yerbas-miner-windows-cuda-x86_64.zip               dist/yerbas-miner-linux-arm64.zip               dist/SHA256SUMS.txt               --title "$tag"               --generate-notes
          fi
