name: Build Binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git libboost-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYERBAS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist/yerbas-miner-linux-x86_64
          cp build/yerbas-miner dist/yerbas-miner-linux-x86_64/
          cp README.md config.example.json dist/yerbas-miner-linux-x86_64/
          tar -C dist -czf dist/yerbas-miner-linux-x86_64.tar.gz yerbas-miner-linux-x86_64
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yerbas-miner-linux-x86_64
          path: dist/yerbas-miner-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git libboost-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYERBAS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist/yerbas-miner-linux-arm64
          cp build/yerbas-miner dist/yerbas-miner-linux-arm64/
          cp README.md config.example.json dist/yerbas-miner-linux-arm64/
          tar -C dist -czf dist/yerbas-miner-linux-arm64.tar.gz yerbas-miner-linux-arm64
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yerbas-miner-linux-arm64
          path: dist/yerbas-miner-linux-arm64.tar.gz
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DYERBAS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/yerbas-miner-windows-x86_64 | Out-Null
          Copy-Item build/Release/yerbas-miner.exe dist/yerbas-miner-windows-x86_64/
          Copy-Item README.md dist/yerbas-miner-windows-x86_64/
          Copy-Item config.example.json dist/yerbas-miner-windows-x86_64/
          Compress-Archive -Path dist/yerbas-miner-windows-x86_64/* -DestinationPath dist/yerbas-miner-windows-x86_64.zip
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yerbas-miner-windows-x86_64
          path: dist/yerbas-miner-windows-x86_64.zip
          if-no-files-found: error

  windows-cuda-x86_64:
    name: Windows CUDA x86_64
    runs-on: [self-hosted, Windows, X64, cuda]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean persistent build directories
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build-cuda -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Verify self-hosted CUDA toolchain
        shell: pwsh
        run: |
          $nvcc = $null
          if ($env:CUDA_PATH) {
            $candidate = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
            if (Test-Path $candidate) { $nvcc = $candidate }
          }

          if (-not $nvcc) {
            $candidates = @(
              'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\nvcc.exe',
              'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8.1\bin\nvcc.exe'
            )
            $nvcc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $nvcc) {
            throw 'Self-hosted runner requires CUDA Toolkit 12.8 with nvcc.exe installed.'
          }

          $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          $versionText = (& $nvcc --version | Out-String)
          Write-Host $versionText
          if ($versionText -notmatch 'release 12\.8') {
            throw "Expected CUDA 12.8 on self-hosted runner. Found:`n$versionText"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio 2022 installer metadata (vswhere.exe) not found.'
          }
          $vsPath = & $vswhere -latest -products * -version '[17.0,18.0)' -property installationPath
          if (-not $vsPath) {
            throw 'Visual Studio 2022 was not found on the self-hosted runner.'
          }

          $buildCustomizations = Join-Path $vsPath 'MSBuild\Microsoft\VC\v170\BuildCustomizations'
          if (-not (Test-Path $buildCustomizations)) {
            throw "VS2022 CUDA BuildCustomizations directory not found: $buildCustomizations"
          }
          $cudaProps = Get-ChildItem $buildCustomizations -Filter 'CUDA *.props' -ErrorAction SilentlyContinue
          if (-not $cudaProps) {
            throw 'CUDA Visual Studio integration is not installed on the self-hosted runner.'
          }

          Write-Host "CUDA_PATH=$cudaRoot"
          Write-Host "VS2022=$vsPath"
          Write-Host 'CUDA Visual Studio integration:'
          $cudaProps | ForEach-Object { Write-Host $_.FullName }

          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cudaRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CUDA build
        shell: pwsh
        run: |
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          cmake -S . -B build-cuda -G "Visual Studio 17 2022" -A x64 -DYERBAS_ENABLE_CUDA=ON -DBUILD_TESTING=ON -DCMAKE_CUDA_COMPILER="$nvcc" -DCUDAToolkit_ROOT="$env:CUDA_PATH"

      - name: Verify CUDA configuration
        shell: pwsh
        run: |
          $compilerFiles = Get-ChildItem build-cuda/CMakeFiles -Recurse -Filter CMakeCUDACompiler.cmake -ErrorAction SilentlyContinue
          if (-not $compilerFiles) {
            throw 'CMake did not generate CMakeCUDACompiler.cmake'
          }
          $compilerText = ($compilerFiles | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if ($compilerText -notmatch 'nvcc(\.exe)?') {
            Write-Host $compilerText
            throw 'Generated CUDA compiler configuration does not reference nvcc'
          }
          if (-not (Test-Path build-cuda/cuda-keccak-validation.vcxproj)) {
            throw 'CUDA validation target was not generated'
          }
          if (-not (Test-Path build-cuda/yerbas-miner.vcxproj)) {
            throw 'Yerbas CUDA miner project was not generated'
          }
          Write-Host 'Confirmed: self-hosted CUDA 12.8 + VS2022 configuration generated CUDA targets.'

      - name: Build CUDA miner
        shell: pwsh
        run: cmake --build build-cuda --config Release --parallel

      - name: Test CPU reference
        shell: pwsh
        run: ctest --test-dir build-cuda -C Release -R ghostrider-smoke --output-on-failure

      - name: Verify CUDA binary
        shell: pwsh
        run: |
          if (-not (Test-Path build-cuda/Release/yerbas-miner.exe)) { throw 'CUDA miner executable not produced' }
          if (-not (Test-Path build-cuda/Release/cuda-keccak-validation.exe)) { throw 'CUDA validation executable not produced' }

      - name: Package CUDA miner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/yerbas-miner-windows-cuda-x86_64 | Out-Null
          Copy-Item build-cuda/Release/yerbas-miner.exe dist/yerbas-miner-windows-cuda-x86_64/
          Copy-Item build-cuda/Release/cuda-keccak-validation.exe dist/yerbas-miner-windows-cuda-x86_64/cuda-core-validation.exe
          Copy-Item README.md dist/yerbas-miner-windows-cuda-x86_64/
          Copy-Item config.example.json dist/yerbas-miner-windows-cuda-x86_64/
          @'
          This artifact was built with the NVIDIA CUDA backend compiled in.
          CUDA configuration is verified before this ZIP can be published.
          Requires a supported NVIDIA GPU and driver.

          Run cuda-core-validation.exe on a real NVIDIA GPU to compare the
          implemented CUDA GhostRider core stages against Yerbas Core.
          '@ | Set-Content dist/yerbas-miner-windows-cuda-x86_64/CUDA-BUILD.txt
          Compress-Archive -Path dist/yerbas-miner-windows-cuda-x86_64/* -DestinationPath dist/yerbas-miner-windows-cuda-x86_64.zip

      - name: Upload CUDA binary
        uses: actions/upload-artifact@v4
        with:
          name: yerbas-miner-windows-cuda-x86_64
          path: dist/yerbas-miner-windows-cuda-x86_64.zip
          if-no-files-found: error
