name: Publish validated 1.0.0.7

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: yerbas-promote-1.0.0.7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 19abf4fcfaff3531fbb34eb8c57bb00d92616092
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19abf4fcfaff3531fbb34eb8c57bb00d92616092
          path: source
      - uses: actions/checkout@v4
        with:
          path: release-docs
      - name: Verify source, tag and successful build provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat source/VERSION)" = '1.0.0.7'
          test "$(git -C source rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/1.0.0.7" --jq '.object.sha')" = "$RELEASE_SHA"
          for run in 38842231591 38842231549 38842231515; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/run.json
            jq -e --arg sha "$RELEASE_SHA" '.head_sha == $sha and .conclusion == "success"' /tmp/run.json
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38842231515/jobs" > /tmp/jobs.json
          jq -e '[.jobs[] | select(.name == "Linux ARM64" and .conclusion == "success")] | length == 1' /tmp/jobs.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38842231591
          name: yerbas-miner-linux-cuda-x86_64
          path: incoming/linux
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38842231549
          name: yerbas-miner-windows-cuda-x86_64
          path: incoming/windows
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38842231515
          name: yerbas-miner-linux-arm64
          path: incoming/arm64
      - name: Package unchanged executables and release documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, tarfile, zipfile
          sha = os.environ['RELEASE_SHA']
          dist = Path('dist')
          dist.mkdir()
          specs = [
              ('linux-cuda-x86_64', 'incoming/linux/yerbas-miner-linux-cuda-x86_64.tar.gz', 'yerbas-miner', 38842231591),
              ('windows-cuda-x86_64', 'incoming/windows/yerbas-miner-windows-cuda-x86_64.zip', 'yerbas-miner.exe', 38842231549),
              ('linux-arm64', 'incoming/arm64/yerbas-miner-linux-arm64.tar.gz', 'yerbas-miner', 38842231515),
          ]
          for platform, archive_path, executable, run in specs:
              folder = dist / ('yerbas-miner-' + platform)
              folder.mkdir()
              if archive_path.endswith('.zip'):
                  with zipfile.ZipFile(archive_path) as archive:
                      matches = [n for n in archive.namelist() if Path(n).name == executable and not n.endswith('/')]
                      assert len(matches) == 1, matches
                      data = archive.read(matches[0])
              else:
                  with tarfile.open(archive_path) as archive:
                      matches = [m for m in archive.getmembers() if m.isfile() and Path(m.name).name == executable]
                      assert len(matches) == 1, matches
                      with archive.extractfile(matches[0]) as binary:
                          data = binary.read()
              assert sha[:12].encode() in data, 'Embedded source mismatch: ' + platform
              assert b'1.0.0.7' in data, 'Embedded version missing: ' + platform
              (folder / executable).write_bytes(data)
              (folder / executable).chmod(0o755)
              shutil.copyfile('release-docs/README.md', folder / 'README.md')
              shutil.copyfile('source/config.example.json', folder / 'config.example.json')
              shutil.copyfile('source/VERSION', folder / 'VERSION')
              shutil.copyfile('release-docs/docs/development/RELEASE_1.0.0.7.md', folder / 'RELEASE-NOTES.md')
              (folder / 'BUILD-INFO.txt').write_text(
                  f'Yerbas Miner 1.0.0.7\nCommit: {sha}\nPlatform: {platform}\nValidated CI run: {run}\n'
                  'Executables are unchanged CI artifacts; release documentation is updated at publication.\n')
              with zipfile.ZipFile(dist / (folder.name + '.zip'), 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(folder.iterdir()):
                      archive.write(path, path.relative_to(dist))
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Upload verified archives and promote Latest
        shell: bash
        run: |
          set -euo pipefail
          gh release view 1.0.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload 1.0.0.7 dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit 1.0.0.7 --repo "$GITHUB_REPOSITORY" --title 1.0.0.7 --notes-file release-docs/docs/development/RELEASE_1.0.0.7.md --draft=false --prerelease=false --latest
